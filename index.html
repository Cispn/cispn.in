    <style>
        :root {
            color-scheme: dark;
            --accent: #bc0000;
            --accent-bright: #ff0000;
            --accent-dark: #2a0000;
            --accent-glow: rgba(188, 0, 0, 0.4);
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #030810;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('https://i.imgur.com/wHr50A7.jpeg');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.2) saturate(1.4);
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)" opacity="0.03"/></svg>');
            z-index: -1;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes redPulse {
            0% {
                box-shadow: 0 0 20px rgba(188, 0, 0, 0.08), inset 0 0 0 rgba(188, 0, 0, 0.05);
                border-color: rgba(188, 0, 0, 0.2);
            }

            50% {
                box-shadow: 0 0 50px rgba(188, 0, 0, 0.25), inset 0 0 25px rgba(188, 0, 0, 0.1);
                border-color: rgba(220, 0, 0, 0.6);
            }

            100% {
                box-shadow: 0 0 20px rgba(188, 0, 0, 0.08), inset 0 0 0 rgba(188, 0, 0, 0.05);
                border-color: rgba(188, 0, 0, 0.2);
            }
        }

        .outer-frame {
            padding: 30px;
            background: rgba(5, 10, 20, 0.5);
            backdrop-filter: blur(30px) saturate(1.2);
            border-radius: 40px;
            border: 1px solid rgba(188, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-out forwards, redPulse 4s infinite ease-in-out;
            transform-style: preserve-3d;
            transform: perspective(1000px);
            transition: transform 0.1s ease-out;
            margin: auto;
            max-width: 100%;
        }

        .profile-card {
            background: linear-gradient(180deg, rgba(25, 0, 0, 1) 0%, rgba(5, 0, 0, 1) 50%, #020000 100%);
            border-radius: 24px;
            width: 400px;
            max-width: 100%;
            border: 1px solid rgba(188, 0, 0, 0.2);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(188, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 0, 0, 0.1);
            transition: transform 0.15s ease, box-shadow 0.4s ease, border-color 0.4s ease;
            position: relative;
            z-index: 10;
        }

        .profile-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y),
                    rgba(188, 0, 0, 0.2),
                    transparent 40%);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            border-radius: 24px;
        }

        .profile-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100vh);
            }
        }

        @keyframes pulseSlow {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.6;
            }
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(188, 0, 0, 0.05), transparent);
            z-index: 51;
            pointer-events: none;
            animation: scanline 4s linear infinite;
        }

        .slot-reel {
            background: rgba(20, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(188, 0, 0, 0.2);
            border-radius: 14px;
            width: 100px;
            height: 110px;
            font-size: 2.8rem;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            box-shadow: inset 0 0 30px rgba(188, 0, 0, 0.1), 0 15px 40px rgba(0, 0, 0, 0.8);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            filter: grayscale(1) brightness(0.7) contrast(1.4);
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0;
            transition: top 0.8s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .reel-strip div {
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
        }

        .spinning .reel-strip {
            animation: infiniteSpin 0.15s linear infinite;
            filter: blur(2px);
        }

        @keyframes infiniteSpin {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-770px);
            }
        }

        @keyframes seven-hit {
            0% {
                transform: scale(0.5) rotate(-15deg);
                filter: brightness(2) blur(5px);
                opacity: 0;
            }

            50% {
                transform: scale(1.2) rotate(5deg);
                filter: brightness(1.5) blur(0);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0deg);
                filter: brightness(1) blur(0);
                opacity: 1;
            }
        }

        .reel-seven {
            width: 80px;
            height: 80px;
            object-fit: contain;
            animation: seven-hit 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            filter: drop-shadow(0 0 15px rgba(188, 0, 0, 0.6));
        }

        .slot-reel.winner {
            filter: none !important;
            border-color: rgba(188, 0, 0, 0.8);
            box-shadow: inset 0 0 40px rgba(188, 0, 0, 0.2), 0 0 30px rgba(188, 0, 0, 0.4);
        }

        .slot-reel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.3) 0%, transparent 15%, transparent 85%, rgba(0, 0, 0, 0.3) 100%);
            z-index: 5;
            pointer-events: none;
        }

        .init-btn {
            border: 1px solid rgba(188, 0, 0, 0.2);
            padding: 14px 50px;
            border-radius: 99px;
            background: rgba(188, 0, 0, 0.05);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .init-btn:hover {
            background: rgba(188, 0, 0, 0.15);
            border-color: rgba(188, 0, 0, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(188, 0, 0, 0.3);
        }

        .progress-bar-glow {
            background: linear-gradient(90deg, #500000, #ff0000, #500000);
            background-size: 200% 100%;
            animation: progressSlide 2.5s linear infinite;
            box-shadow: 0 0 10px rgba(188, 0, 0, 0.4);
            position: relative;
        }

        .progress-bar-glow::after {
            content: "";
            position: absolute;
            inset: 0;
            background: inherit;
            filter: blur(4px);
            opacity: 0.6;
        }

        .profile-card:hover::before {
            opacity: 1;
        }

        .profile-card>* {
            position: relative;
            z-index: 1;
        }

        .profile-card:hover {
            transform: scale(1.02);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.95),
                0 0 60px rgba(188, 0, 0, 0.25),
                0 0 100px rgba(255, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 0, 0, 0.2);
            border-color: rgba(188, 0, 0, 0.4);
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020810;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-out;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(74, 144, 217, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hide-loader {
            opacity: 0;
            pointer-events: none;
        }

        .banner-gradient {
            background: linear-gradient(to bottom, transparent 50%, rgba(8, 15, 30, 0.6) 100%);
        }

        #discordBanner {
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            transition: filter 0.5s ease;
        }

        .profile-card:hover #discordBanner {
            filter: brightness(1.2) contrast(1.1);
        }

        .status-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 4px solid rgba(20, 0, 0, 1);
            z-index: 30;
        }

        .status-online {
            background: #43b581;
            box-shadow: 0 0 10px #43b581;
        }

        .status-idle {
            background: #faa61a;
            box-shadow: 0 0 10px #faa61a;
        }

        .status-dnd {
            background: #f04747;
            box-shadow: 0 0 10px #f04747;
        }

        .status-offline {
            background: #747f8d;
        }

        @keyframes musicBounce {

            0%,
            100% {
                transform: scaleY(0.4);
            }

            25% {
                transform: scaleY(1);
            }

            50% {
                transform: scaleY(0.6);
            }

            75% {
                transform: scaleY(0.8);
            }
        }

        .music-bar {
            width: 3px;
            height: 12px;
            background: var(--accent);
            border-radius: 2px;
            display: inline-block;
            margin: 0 1px;
            animation: musicBounce 1s ease-in-out infinite;
        }

        .music-bar:nth-child(2) {
            animation-delay: 0.2s;
        }

        .music-bar:nth-child(3) {
            animation-delay: 0.4s;
        }

        .music-bar:nth-child(4) {
            animation-delay: 0.1s;
        }

        .music-bar:nth-child(5) {
            animation-delay: 0.3s;
        }

        .accent-text {
            color: var(--accent-bright);
        }

        .accent-border {
            border-color: rgba(188, 0, 0, 0.15);
        }

        .accent-hover:hover {
            background: rgba(188, 0, 0, 0.1);
            border-color: rgba(188, 0, 0, 0.3);
            box-shadow: 0 0 20px rgba(188, 0, 0, 0.06);
            transform: translateY(-1px);
        }

        .text-spotify {
            color: var(--accent) !important;
        }

        .bg-spotify {
            background-color: var(--accent) !important;
        }

        .verified-badge {
            height: 24px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.8));
            transform: translateZ(10px);
            will-change: transform;
            padding: 2px;
        }

        @keyframes breathingGlow {

            0%,
            100% {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 10px rgba(188, 0, 0, 0.2);
                border-color: rgba(255, 0, 0, 0.3);
            }

            50% {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 0, 0, 0.5);
                border-color: rgba(255, 0, 0, 0.6);
            }
        }

        @keyframes scanningLine {
            0% {
                transform: translateX(-150%) skewX(-25deg);
            }

            100% {
                transform: translateX(150%) skewX(-25deg);
            }
        }

        @keyframes textFlicker {

            0%,
            100% {
                opacity: 1;
                text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
            }

            5%,
            15%,
            25% {
                opacity: 0.8;
                text-shadow: none;
            }

            10%,
            20% {
                opacity: 1;
                text-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
            }
        }

        .badge-tooltip {
            position: absolute;
            top: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: linear-gradient(135deg, rgba(40, 0, 0, 0.95) 0%, rgba(10, 0, 0, 0.98) 100%);
            backdrop-filter: blur(25px) saturate(1.5);
            border: 1.5px solid rgba(255, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 8px;
            color: #ff0000;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
            overflow: hidden;
            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.3),
                0 0 40px rgba(188, 0, 0, 0.2),
                inset 0 0 20px rgba(255, 0, 0, 0.05);
        }

        .badge-tooltip::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 0, 0, 0.15),
                    transparent);
            animation: scanningLine 2.5s infinite linear;
            pointer-events: none;
        }

        .badge-tooltip::after {
            content: "";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: transparent transparent rgba(255, 0, 0, 0.4) transparent;
            filter: drop-shadow(0 -2px 4px rgba(255, 0, 0, 0.3));
        }

        .group\/badge:hover .badge-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .social-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(188, 0, 0, 0.08);
            border: 1px solid rgba(188, 0, 0, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--accent);
            position: relative;
            overflow: hidden;
        }

        .social-icon::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 0, 0, 0.2), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-icon:hover::before {
            opacity: 1;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
                text-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
            }

            20% {
                transform: translate(-2px, 2px);
                text-shadow: 2px 0 rgba(255, 0, 0, 0.7), -2px 0 rgba(0, 255, 255, 0.7);
            }

            40% {
                transform: translate(-2px, -2px);
                text-shadow: -2px 0 rgba(255, 0, 0, 0.7), 2px 0 rgba(0, 255, 255, 0.7);
            }

            60% {
                transform: translate(2px, 2px);
                text-shadow: 2px 2px rgba(255, 0, 0, 0.7), -2px -2px rgba(0, 255, 255, 0.7);
            }

            80% {
                transform: translate(2px, -2px);
                text-shadow: -2px 2px rgba(255, 0, 0, 0.7), 2px -2px rgba(0, 255, 255, 0.7);
            }

            100% {
                transform: translate(0);
                text-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
            }
        }

        #discordUsername:active {
            animation: glitch 0.3s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateY(-3px) scale(1.05) rotate(0deg);
            }

            25% {
                transform: translateY(-3px) scale(1.05) rotate(-5deg);
            }

            75% {
                transform: translateY(-3px) scale(1.05) rotate(5deg);
            }
        }

        .social-icon:hover {
            background: rgba(188, 0, 0, 0.2);
            border-color: rgba(188, 0, 0, 0.5);
            animation: shake 0.5s ease-in-out;
            box-shadow:
                0 10px 25px rgba(188, 0, 0, 0.2),
                0 0 20px rgba(255, 0, 0, 0.1);
        }

        .social-icon svg,
        .social-icon i {
            width: 18px;
            height: 18px;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .social-icon:hover svg,
        .social-icon:hover i {
            transform: scale(1.1);
        }

        .server-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: rgba(188, 0, 0, 0.08);
            border: 1px solid rgba(188, 0, 0, 0.15);
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
            min-width: 140px;
            position: relative;
            overflow: hidden;
        }

        .server-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .server-btn:hover::before {
            opacity: 1;
        }

        .server-btn:hover {
            background: rgba(188, 0, 0, 0.15);
            border-color: rgba(188, 0, 0, 0.4);
            transform: translateY(-2px) scale(1.02);
            box-shadow:
                0 8px 20px rgba(188, 0, 0, 0.15),
                0 0 15px rgba(255, 0, 0, 0.05);
        }

        .server-btn img {
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .server-btn:hover img {
            transform: scale(1.1);
        }

        .server-btn span {
            position: relative;
            z-index: 1;
        }

        /* NEW INTERACTIVE EFFECTS */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) translateX(0px);
            }

            25% {
                transform: translateY(-10px) translateX(5px);
            }

            50% {
                transform: translateY(-5px) translateX(-5px);
            }

        .card-particle {
            position: absolute;

        .view-counter {
            transition: all 0.3s ease;
        }

        .view-counter:hover {
            color: var(--accent-bright);
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);

        @keyframes ripple {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }

            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }

        .ripple-effect {

        const CONFIG = {

            BADGES: ["discordnitro", "hypesquadbalance", "boosts/discordboost2"],

        };

        const card = document.getElementById('profileCard');

        // Ripple effect on click
        card.addEventListener('click', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const ripple = document.createElement('div');
            ripple.className = 'ripple-effect';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.style.width = '20px';
            ripple.style.height = '20px';

            card.appendChild(ripple);

            setTimeout(() => ripple.remove(), 600);
        });

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const rotateX = ((y - centerY) / centerY) * -5;
            const rotateY = ((x - centerX) / centerX) * 5;

            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

            // Move particles based on mouse
            const particles = card.querySelectorAll('.card-particle');
            particles.forEach((particle, i) => {
                const dx = (x - parseFloat(particle.style.left) * rect.width / 100) / rect.width;
                const dy = (y - parseFloat(particle.style.top) * rect.height / 100) / rect.height;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 0.3) {
                    const angle = Math.atan2(dy, dx);
                    const force = (0.3 - distance) * 30;
                    particle.style.transform = `translate(${-Math.cos(angle) * force}px, ${-Math.sin(angle) * force}px)`;
                } else {
                    particle.style.transform = 'translate(0, 0)';
                }
            });
        });

        function crossFade(outAudio, inAudio, targetVol, duration = 3000) {
            let volOut = outAudio.volume;
            let volIn = 0;
            inAudio.volume = 0;
            inAudio.play();

            const frames = 60;
            const stepOut = volOut / frames;
            const stepIn = targetVol / frames;
            const intervalTime = duration / frames;

            const fadeInterval = setInterval(() => {
                let finished = true;
                if (volOut > 0) {
                    volOut = Math.max(0, volOut - stepOut);
                    outAudio.volume = volOut;
                    finished = false;
                }

                if (volIn < targetVol) {
                    volIn = Math.min(targetVol, volIn + stepIn);
                    inAudio.volume = volIn;
                    finished = false;
                }

                if (finished) {
                    clearInterval(fadeInterval);
                    outAudio.pause();
                }
            }, intervalTime);
        }

        const overlay = document.getElementById('clickOverlay');
        const money = document.getElementById('moneyRain');
        const slotSound = document.getElementById('slotSound');

        async function fetchMusic(lanyardData) {
            const area = document.getElementById('musicArea');
            const spotifyLink = document.getElementById('spotifyLink');
            const trackArt = document.getElementById('trackArt');

            if (!lanyardData) return area.classList.add('hidden');

            // Robust album art error handling
            trackArt.onerror = () => {
                if (trackArt.src.includes('ocean.jpg')) return;
                trackArt.src = "./ocean.jpg";
            };

            if (lanyardData.spotify) {
                const s = lanyardData.spotify;
                area.classList.remove('hidden');
                document.getElementById('musicHeaderText').textContent = "Listening to Spotify";

                // Null-safe name/artist logic
                const songName = s.song || "Local Track";
                const artistName = (s.artist || "Local File").replace(/;/g, ',');

                document.getElementById('trackName').textContent = songName;
                document.getElementById('artistName').textContent = artistName;

                // High-fidelity fallback for local tracks
                trackArt.src = s.album_art_url || "./ocean.jpg";

                const progressArea = document.getElementById('spotifyProgress');
                if (s.timestamps) {
                    progressArea.classList.remove('hidden');
                    window.spotifyTimestamps = s.timestamps;
                    const total = s.timestamps.end - s.timestamps.start;
                    const min = Math.floor(total / 60000);
                    const sec = Math.floor((total % 60000) / 1000);
                    document.getElementById('spotifyTotal').textContent = `${min}:${String(sec).padStart(2, '0')}`;
                } else {
                    progressArea.classList.add('hidden');
                    window.spotifyTimestamps = null;
                }

                const imageContainer = document.getElementById('musicContainer');
                if (imageContainer) {
                    imageContainer.style.backgroundColor = "rgba(255,255,255,0.05)";
                    imageContainer.style.border = "1px solid rgba(255,255,255,0.05)";
                }
                trackArt.className = "w-14 h-14 rounded-lg object-cover bg-neutral-800 shadow-md";
                trackArt.style.mixBlendMode = "normal";
                trackArt.style.backgroundColor = "";
                trackArt.style.filter = "none";

                // Null-safe search query
                const query = encodeURIComponent(`${songName} ${artistName} lyrics`);
                const rickroll = "https://www.youtube.com/watch?v=xMHJGd3wwZk";

                spotifyLink.classList.remove('hidden');
                spotifyLink.style.display = '';

                // Rickroll if local file (no track_id)
                spotifyLink.href = s.track_id
                    ? `https://open.spotify.com/track/${s.track_id}`
                    : rickroll;

                return;
            }

            const activity = lanyardData.activities?.find(a => a.id !== 'custom' && a.id !== 'spotify:1');
            if (activity) {
                area.classList.remove('hidden');
                document.getElementById('musicHeaderText').textContent = activity.type === 0 ? "Playing" : "Activity";
                document.getElementById('trackName').textContent = activity.name;

                document.getElementById('spotifyProgress').classList.add('hidden');
                window.spotifyTimestamps = null;

                let timeStr = "";
                if (activity.timestamps?.start) {
                    const elapsed = Date.now() - activity.timestamps.start;
                    const h = Math.floor(elapsed / 3600000);
                    const m = Math.floor((elapsed % 3600000) / 60000);
                    const s = Math.floor((elapsed % 60000) / 1000);
                    timeStr = h > 0
                        ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
                        : `${m}:${String(s).padStart(2, '0')}`;
                }

                const baseStatus = activity.details || activity.state || "Active";
                if (timeStr) {
                    const icon = activity.type === 0 ? "🎮 " : "⏳ ";
                    const artistElem = document.getElementById('artistName');
                    artistElem.innerHTML = `<span style="font-weight: 800; color: var(--accent);">${icon}${timeStr}</span>`;
                    window.currentActivityStart = activity.timestamps.start;
                    window.currentActivityType = activity.type;
                } else {
                    document.getElementById('artistName').textContent = baseStatus;
                    window.currentActivityStart = null;
                }

                let imageUrl = "";
                const name = (activity.name || "").toLowerCase();

                if (name.includes('roblox')) {
                    // Roblox Specific
                    imageUrl = "https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/original/4X/0/e/e/0eeeb19633422b1241f4306419a0f15f39d58de9.png";
                    trackArt.className = "w-14 h-14 rounded-lg object-contain";
                    trackArt.style.backgroundColor = 'transparent';
                    trackArt.style.filter = "brightness(0) saturate(100%) invert(11%) sepia(83%) saturate(5428%) hue-rotate(359deg) brightness(96%) contrast(116%)";
                } else {
                    trackArt.className = "w-14 h-14 rounded-lg object-cover shadow-md";
                    trackArt.style.backgroundColor = 'transparent';
                    trackArt.style.filter = "none";

                    if (activity.assets?.large_image) {
                        if (activity.assets.large_image.startsWith('mp:')) {
                            imageUrl = `https://media.discordapp.net/${activity.assets.large_image.replace('mp:', '')}`;
                        } else {
                            imageUrl = `https://cdn.discordapp.com/app-assets/${activity.application_id}/${activity.assets.large_image}.png`;
                        }
                    } else {
                        imageUrl = "./eye.gif"; // Fallback
                    }
                }

                trackArt.src = imageUrl;

                const imageContainer = document.getElementById('musicContainer');
                if (imageContainer) {
                    imageContainer.style.backgroundColor = "rgba(255,255,255,0.05)";
                    imageContainer.style.border = "1px solid rgba(255,255,255,0.05)";
                }

                const isRoblox = name.includes('roblox');
                if (isRoblox) {
                    trackArt.className = "w-14 h-14 rounded-lg object-contain";
                    trackArt.style.backgroundColor = 'transparent';
                    trackArt.style.mixBlendMode = "normal";
                    trackArt.style.filter = "brightness(0) saturate(100%) invert(11%) sepia(83%) saturate(5428%) hue-rotate(359deg) brightness(96%) contrast(116%)";
                } else {
                    trackArt.className = "w-14 h-14 rounded-lg object-cover shadow-md";
                    trackArt.style.mixBlendMode = "normal";
                    trackArt.style.backgroundColor = "transparent";
                    trackArt.style.filter = "none";
                }

                spotifyLink.classList.add('hidden');
                spotifyLink.style.display = 'none'; // Force hide to stop the overlay
                return;
            }

            // 3. Nothing playing
            area.classList.add('hidden');
        }



        async function fetchDiscord() {
            try {
                const lReq = await fetch(`https://api.lanyard.rest/v1/users/${CONFIG.DISCORD_ID}`);
                const lanyard = await lReq.json();

                const pReq = await fetch(`https://discord-lookup-api-opal-three.vercel.app/v1/user/${CONFIG.DISCORD_ID}`);
                const profile = await pReq.json();

                // Hacker-style scramble animation for username
                const username = profile.global_name || profile.username;
                const usernameElement = document.getElementById('discordUsername');
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';

                let iterations = 0;
                const maxIterations = username.length;

                const scrambleInterval = setInterval(() => {
                    usernameElement.textContent = username
                        .split('')
                        .map((char, index) => {
                            if (index < iterations) {
                                return username[index];
                            }
                            return chars[Math.floor(Math.random() * chars.length)];
                        })
                        .join('');

                    iterations += 1 / 3;

                    if (iterations >= maxIterations) {
                        clearInterval(scrambleInterval);
                        usernameElement.textContent = username;
                    }
                }, 50);

                // Render Badges (uses CONFIG.BADGES directly as filenames)
                const badgeContainer = document.getElementById('badges');
                badgeContainer.innerHTML = '';

                if (CONFIG.BADGES && CONFIG.BADGES.length > 0) {
                    CONFIG.BADGES.forEach(badge => {
                        const img = document.createElement('img');
                        img.src = `${CONFIG.ASSET_URL}${badge}.svg`;
                        img.className = "w-5 h-5 drop-shadow-md hover:scale-110 transition-transform";
                        img.title = badge.replace(/\//g, ' ').replace(/discord/gi, '');
                        img.onerror = () => img.style.display = 'none';
                        badgeContainer.appendChild(img);
                    });
                } else {
                    badgeContainer.style.display = 'none';
                }

                if (profile.avatar?.link) {
                    const avatarUrl = `${profile.avatar.link}?size=1024`;
                    document.getElementById('discordAvatar').src = avatarUrl;
                    let link = document.querySelector("link[rel~='icon']");
                    if (!link) {
                        link = document.createElement('link');
                        link.rel = 'icon';
                        document.head.appendChild(link);
                    }
                    link.href = avatarUrl;

                    document.getElementById('discordAvatar').style.borderColor = "#140000";
                }

                const banner = document.getElementById('discordBanner');
                if (profile.banner?.link) {
                    let bannerUrl = profile.banner.link;
                    if (bannerUrl.includes('?')) {
                        bannerUrl = bannerUrl.replace(/size=\d+/, 'size=4096');
                    } else {
                        bannerUrl += '?size=4096';
                    }
                    banner.style.backgroundImage = `url(${bannerUrl})`;
                } else {
                    banner.style.backgroundColor = profile.accent_color || "#1a1a1a";
                }

                if (lanyard.success) {
                    const s = lanyard.data.discord_status;
                    const statusMap = { online: 'status-online', idle: 'status-idle', dnd: 'status-dnd', offline: 'status-offline' };
                    document.getElementById('statusDot').className = `status-dot ${statusMap[s] || 'status-offline'}`;
                    fetchMusic(lanyard.data);
                } else {
                    fetchMusic(null);
                }

            } catch (e) {
                console.error("Discord Fetch Error:", e);
            }
        }



        function init() {
            fetchDiscord();
            setInterval(fetchDiscord, 5000);

            const hideLoader = () => {
                const loader = document.getElementById('loader');
                if (loader) loader.classList.add('hide-loader');
            };

            if (document.readyState === 'complete') {
                hideLoader();
            } else {
                window.addEventListener('load', hideLoader);
            }
            setTimeout(hideLoader, 3000);

            // Smooth 1s Ticker
            setInterval(() => {
                if (window.currentActivityStart) {
                    const elapsed = Date.now() - window.currentActivityStart;
                    const h = Math.floor(elapsed / 3600000);
                    const m = Math.floor((elapsed % 3600000) / 60000);
                    const s = Math.floor((elapsed % 60000) / 1000);
                    const timeStr = h > 0
                        ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
                        : `${m}:${String(s).padStart(2, '0')}`;
                    const icon = window.currentActivityType === 0 ? "🎮 " : "⏳ ";
                    const artistElem = document.getElementById('artistName');
                    if (artistElem) {
                        artistElem.innerHTML = `<span style="font-weight: 800; color: var(--accent);">${icon}${timeStr}</span>`;
                    }
                }

                // Spotify Progress Ticker
                if (window.spotifyTimestamps) {
                    const now = Date.now();
                    const start = window.spotifyTimestamps.start;
                    const end = window.spotifyTimestamps.end;
                    const total = end - start;
                    const elapsed = Math.min(now - start, total);
                    const percent = (elapsed / total) * 100;

                    document.getElementById('spotifyProgressBar').style.width = `${percent}%`;

                    const cMin = Math.floor(elapsed / 60000);
                    const cSec = Math.floor((elapsed % 60000) / 1000);
                    document.getElementById('spotifyCurrent').textContent = `${cMin}:${String(cSec).padStart(2, '0')}`;
                }
            }, 100);
        }

        // Animated Title

        // ─── Particle Constellation ───
        (function () {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles, mouse;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }

            mouse = { x: w / 2, y: h / 2, active: false };

            window.addEventListener('resize', resize);
            document.addEventListener('mousemove', e => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                mouse.active = true;
            });
            document.addEventListener('mouseleave', () => mouse.active = false);

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = (Math.random() - 0.5) * 0.4;
                    this.r = Math.random() * 2 + 1;
                    // Red constellation hues
                    const hue = 0 + Math.random() * 20; // 0-20 = red range
                    const sat = 80 + Math.random() * 20;
                    const light = 40 + Math.random() * 20;
                    this.color = `hsla(${hue}, ${sat}%, ${light}%, 0.8)`;
                    this.glowColor = `hsla(${hue}, ${sat}%, ${light}%, 0.3)`;
                }
                update() {
                    // Drift
                    this.x += this.vx;
                    this.y += this.vy;

                    // Mouse attraction
                    if (mouse.active) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 200) {
                            this.vx += dx * 0.00008;
                            this.vy += dy * 0.00008;
                        }
                    }

                    // Speed limit
                    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > 1.2) {
                        this.vx *= 0.98;
                        this.vy *= 0.98;
                    }

                    // Wrap edges
                    if (this.x < -10) this.x = w + 10;
                    if (this.x > w + 10) this.x = -10;
                    if (this.y < -10) this.y = h + 10;
                    if (this.y > h + 10) this.y = -10;
                }
                draw() {
                    // Glow
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r * 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.glowColor;
                    ctx.fill();
                    // Core dot
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }

            function init_particles() {
                resize();
                const count = Math.floor((w * h) / 12000);
                particles = [];
                for (let i = 0; i < count; i++) particles.push(new Particle());
            }

            function drawLines() {
                const maxDist = 140;
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < maxDist) {
                            const alpha = (1 - dist / maxDist) * 0.25;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(188, 0, 0, ${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                    if (mouse.active) {
                        const dx = particles[i].x - mouse.x;
                        const dy = particles[i].y - mouse.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 180) {
                            const alpha = (1 - dist / 180) * 0.4;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.strokeStyle = `rgba(255, 0, 0, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => { p.update(); p.draw(); });
                drawLines();
                requestAnimationFrame(animate);
            }

            init_particles();
            animate();
            window.addEventListener('resize', init_particles);
        })();
    </script>
