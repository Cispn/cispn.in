<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-base);color:var(--tx);font-family:var(--ff);overflow:hidden;cursor:none}

#bg::before,#bg::after{content:'';position:absolute;border-radius:50%;filter:blur(90px);animation:orb 12s ease-in-out infinite alternate}
#bg::before{width:500px;height:500px;background:var(--bg-orb1);top:-100px;left:-100px;animation-duration:14s}

<script>
let _wavePlaying = false;
let _analyser = null, _dataArr = null;

(function(){
  const C = CFG, K = C.COLOR;

  if(C.BANNER && C.BANNER.url){

  const bgm = document.getElementById('bg-media');
  const bgo = document.getElementById('bg-over');

    bgm.src=C.BG.url; bgm.style.display='block';
    bgo.style.cssText=`display:block;background:rgba(0,0,0,${C.BG.overlay})`;
  } else if(C.BG.type === 'video' && C.BG.url){
    const v=document.createElement('video');
    v.setAttribute('autoplay',''); v.setAttribute('loop',''); v.setAttribute('muted',''); v.setAttribute('playsinline','');
    v.muted=true;
    v.src=C.BG.url;
    v.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
    document.getElementById('bg').appendChild(v);
    bgo.style.cssText=`display:block;background:rgba(0,0,0,${C.BG.overlay})`;
    v.play().catch(()=>{});
  } else if(C.BG.type === 'webcam'){
    const v=document.createElement('video');
    v.autoplay=true; v.muted=true; v.playsInline=true;
    v.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)';
    document.getElementById('bg').appendChild(v);
    bgo.style.cssText=`display:block;background:rgba(0,0,0,${C.BG.overlay??0.55})`;
    navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'}})

        console.warn(err);

  setName('—');
  document.getElementById('av-el').textContent = '?';
  document.getElementById('p-handle').textContent = '';
  
  if(!C.DISCORD_ID || C.DISCORD_ID === 'YOUR_DISCORD_ID_HERE'){

    else document.getElementById('av-el').textContent = C.NAME[0]?.toUpperCase()||'?';
  }

  if(C.ABOUT && C.ABOUT.trim()){

  initCursor();
  initTilt();

  if(C.DISCORD_ID && C.DISCORD_ID !== 'YOUR_DISCORD_ID_HERE') startLanyard(C.DISCORD_ID);

  initPlayer(C.TRACKS);

  fetch('https://api.counterapi.dev/v1/arman-dhindsas-team-3517/first-counter-3517/up')

function initCursor(){
  const cv  = document.getElementById('cur-canvas');
  const ctx = cv.getContext('2d');

  function resize(){ cv.width=innerWidth; cv.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  let mx=innerWidth/2, my=innerHeight/2;
  let sx=mx, sy=my;

  document.addEventListener('mousemove', e=>{ mx=e.clientX; my=e.clientY; });

  function parseAccent(){
    const c=getComputedStyle(document.documentElement).getPropertyValue('--cursor').trim()||'#ffffff';
    if(c.startsWith('#')){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
    const m=c.match(/[0-9]+/g);return m?[+m[0],+m[1],+m[2]]:[255,255,255];
  }

  function draw(){
    requestAnimationFrame(draw);
    ctx.clearRect(0,0,cv.width,cv.height);

    sx+=(mx-sx)*0.18; sy+=(my-sy)*0.18;

    const [r,g,b]=parseAccent();

    const grd=ctx.createRadialGradient(sx,sy,0,sx,sy,22);
    grd.addColorStop(0,`rgba(${r},${g},${b},0.25)`);
    grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.beginPath();ctx.arc(sx,sy,22,0,Math.PI*2);
    ctx.fillStyle=grd;ctx.fill();

    ctx.beginPath();ctx.arc(sx,sy,4,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},1)`;
    ctx.shadowColor=`rgba(${r},${g},${b},1)`;
    ctx.shadowBlur=10;
    ctx.fill();
    ctx.shadowBlur=0;
  }
  draw();
}

function initTilt(){
  const card  = document.getElementById('card');
  const shine = document.getElementById('shine');
  const DEG   = CFG.TILT_DEG;
  const SC    = CFG.TILT_SCALE;

  card.addEventListener('animationend', () => {
    card.style.animation = 'none';
    card.style.opacity   = '1';
    card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
  }, { once: true });

  card.addEventListener('mousemove', function(e){
    const r  = this.getBoundingClientRect();
    const nx = (e.clientX - r.left  - r.width  * .5) / (r.width  * .5);
    const ny = (e.clientY - r.top   - r.height * .5) / (r.height * .5);
    const rX = -ny * DEG;
    const rY =  nx * DEG;

    this.style.transition = 'box-shadow .2s';
    this.style.transform  = `rotateX(${rX}deg) rotateY(${rY}deg) scale(${SC})`;

    shine.style.opacity    = '1';
    shine.style.background = `radial-gradient(circle at ${(nx*.5+.5)*100}% ${(ny*.5+.5)*100}%, var(--card-shine), transparent 55%)`;
  });

  card.addEventListener('mouseleave', function(){
    this.style.transition = 'transform .7s cubic-bezier(.16,1,.3,1), box-shadow .3s';
    this.style.transform  = 'rotateX(0deg) rotateY(0deg) scale(1)';
    shine.style.opacity   = '0';
  });

  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.matchMedia('(pointer:coarse)').matches;
  if(isMobile && window.DeviceOrientationEvent){
    let baseBeta = null, baseGamma = null;

    const footLinks = document.getElementById('foot-links');
    const resetGyroBtn = document.createElement('button');
    resetGyroBtn.className = 'foot-btn';
    resetGyroBtn.style.cursor = 'pointer';
    
    resetGyroBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px; opacity:0.9;"><circle cx="12" cy="12" r="3"/><path d="M19 12h3"/><path d="M2 12h3"/><path d="M12 2v3"/><path d="M12 19v3"/></svg>Recenter`;
    resetGyroBtn.title = "Recalibrate Tilt Center";
    resetGyroBtn.onclick = () => {
      baseBeta = null;
      baseGamma = null;
      resetGyroBtn.style.transform = 'scale(0.9)';
      setTimeout(() => resetGyroBtn.style.transform = '', 150);
    };
    footLinks.appendChild(resetGyroBtn);

    function applyGyro(e){
      if(baseBeta === null){
        baseBeta  = e.beta  || 0;
        baseGamma = e.gamma || 0;
        return;
      }
      
      const dGamma = Math.max(-30, Math.min(30, (e.gamma || 0) - baseGamma));
      const dBeta  = Math.max(-30, Math.min(30, (e.beta  || 0) - baseBeta));
      
      const rY =  (dGamma / 30) * (DEG * 1.5);
      const rX = -(dBeta  / 30) * (DEG * 1.5);
      
      card.style.transition = 'transform .08s linear';
      card.style.transform  = `rotateX(${rX}deg) rotateY(${rY}deg) scale(1)`;
      const nx = dGamma / 30;
      const ny = dBeta  / 30;
      shine.style.opacity    = '0.55';
      shine.style.background = `radial-gradient(circle at ${(nx*.5+.5)*100}% ${(ny*.5+.5)*100}%, var(--card-shine), transparent 55%)`;
    }

    function startGyro(){
      window.addEventListener('deviceorientation', applyGyro);
    }

    if (typeof DeviceOrientationEvent.requestPermission !== 'function') {
      startGyro();
    } else {
      const splashBtn = document.getElementById('audio-splash');
      if (splashBtn) {
        splashBtn.addEventListener('click', function(){
          DeviceOrientationEvent.requestPermission()
            .then(state => { 
              if(state === 'granted') startGyro(); 
            })
            .catch(()=>{});
        }, { once: true });
      }
    }
  }
}

function initWave(){
  const cv  = document.getElementById('waveCanvas');
  const ctx = cv.getContext('2d');

  function resize(){
    const wrap = cv.parentElement;
    cv.width  = wrap.clientWidth;
    cv.height = wrap.clientHeight;
  }
  resize(); addEventListener('resize', resize);

  const BAR_COUNT = 48;
  const targets   = new Float32Array(BAR_COUNT).fill(0);
  const current   = new Float32Array(BAR_COUNT).fill(0);

  function draw(){
    requestAnimationFrame(draw);
    const W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);

    const style = getComputedStyle(document.documentElement);
    const waveTop = style.getPropertyValue('--wave-top').trim() || '#ffffff';
    const waveBot = style.getPropertyValue('--wave-bot').trim() || 'rgba(13,71,161,1)';

    for(let i=0;i<BAR_COUNT;i++){
      if(_analyser && _wavePlaying && _dataArr){
        _analyser.getByteFrequencyData(_dataArr);
        const chunk = Math.floor(_dataArr.length / BAR_COUNT);
        let sum=0; for(let j=0;j<chunk;j++) sum+=_dataArr[i*chunk+j];
        targets[i] = (sum/chunk/255);
      } else if(_wavePlaying){
        targets[i] = .15 + Math.random()*.7 * Math.sin(Date.now()*.002 + i*.4)*Math.sin(Date.now()*.003+i*.2)*.5+.5;
        targets[i] = Math.max(.05, Math.abs(targets[i]));
      } else {
        targets[i] = .04 + Math.sin(Date.now()*.0008 + i*.3)*.025;
      }
      current[i] += (targets[i] - current[i]) * (_wavePlaying ? .25 : .08);
    }

    const gap  = 3;
    const barW = (W - gap*(BAR_COUNT-1)) / BAR_COUNT;

    for(let i=0;i<BAR_COUNT;i++){
      const h    = Math.max(3, current[i] * H * .88);
      const x    = i*(barW+gap);
      const y    = (H-h)/2;
      const alpha= .4 + current[i]*.6;

      const grad = ctx.createLinearGradient(0,y,0,y+h);
      grad.addColorStop(0, hexToRgba(waveTop, alpha));
      grad.addColorStop(1, hexToRgba(waveBot, alpha*.5));

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x, y, barW, h, 2);
      ctx.fill();
    }
  }
  draw();
}

function hexToRgba(hex,a){
  hex=hex.trim();
  if(hex.startsWith('#')){
    const n=parseInt(hex.slice(1),16);
    const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    return `rgba(${r},${g},${b},${a})`;
  }
  if(hex.startsWith('rgba')){
    return hex.replace(/[\d.]+\s*\)$/,`${a})`);
  }
  if(hex.startsWith('rgb(')){
    return hex.replace('rgb(','rgba(').replace(')',`,${a})`);
  }
  return hex;
}

function startLanyard(id){
  let hb=null, wsOk=false;

  function fetchREST(){
    fetch('https://api.lanyard.rest/v1/users/'+id)
      .then(r=>r.ok?r.json():null)
      .then(j=>{ if(j&&j.data) applyPresence(j.data); })
      .catch(()=>{});
  }
  fetchREST();

  function connect(){
    const ws=new WebSocket('wss://api.lanyard.rest/socket');
    ws.onopen=()=>{ wsOk=true; };
    ws.onmessage=ev=>{
      const {op,d,t}=JSON.parse(ev.data);
      if(op===1){
        hb=setInterval(()=>ws.send(JSON.stringify({op:3})),d.heartbeat_interval);
        ws.send(JSON.stringify({op:2,d:{subscribe_to_id:id}}));
      }
      if(op===0&&(t==='INIT_STATE'||t==='PRESENCE_UPDATE')) applyPresence(d);
    };
    ws.onclose=()=>{clearInterval(hb);wsOk=false;setTimeout(connect,3000)};
    ws.onerror=()=>ws.close();
  }
  connect();
  setInterval(()=>{ if(!wsOk) fetchREST(); },30000);
}

function applyPresence(d){
  const u=d.discord_user;

  if(u.avatar) setAvatar(`https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`);
  else document.getElementById('av-el').textContent = (u.global_name||u.username||'?')[0].toUpperCase();

  setName(u.global_name||u.username);
  const handleEl = document.getElementById('p-handle');
  if(u.discriminator && u.discriminator !== '0')
    handleEl.textContent = '@'+u.username+'#'+u.discriminator;
  else
    handleEl.textContent = '@'+u.username;

  document.getElementById('av-dot').dataset.s = d.discord_status||'offline';

  const acts   = d.activities||[];
  const custom = acts.find(a=>a.type===4);
  const rich   = acts.find(a=>a.type===0||a.type===1||a.type===2||a.type===3||a.type===5);
  const actEl  = document.getElementById('p-act');
  const actTxt = document.getElementById('act-txt');

  if(custom){
    const emoji = custom.emoji?.name ? custom.emoji.name+' ' : '';
    const label = (emoji+(custom.state||'')).trim();
    if(label){ actTxt.textContent=label; actEl.style.display='inline-flex'; }
    else actEl.style.display='none';
  } else {
    actEl.style.display='none';
  }

  const card       = document.getElementById('activity-card');
  const actAppName = document.getElementById('act-app-name');
  const actName    = document.getElementById('act-name');
  const actDetails = document.getElementById('act-details');
  const actState   = document.getElementById('act-state');
  const actElapsed = document.getElementById('act-elapsed');
  const actLarge   = document.getElementById('act-large-img');
  const actSmall   = document.getElementById('act-small-img');

  if(window._actElapsedTimer) clearInterval(window._actElapsedTimer);

  if(rich){
    const typeLabels={0:'Playing',1:'Streaming',2:'Listening to',3:'Watching',5:'Competing in'};
    actAppName.textContent = typeLabels[rich.type]||'Activity';
    actName.textContent    = rich.name||'';
    actDetails.textContent = rich.details||'';
    actDetails.style.display = rich.details ? 'block' : 'none';
    actState.textContent   = rich.state||'';
    actState.style.display = rich.state ? 'block' : 'none';

    const appId = rich.application_id;

    function parseImageStr(imgStr, id) {
      if (!imgStr) return null;
      if (imgStr.startsWith('http')) return imgStr;
      if (imgStr.startsWith('mp:external/')) return 'https://media.discordapp.net/' + imgStr.replace('mp:', '');
      if (imgStr.startsWith('external/')) return 'https://media.discordapp.net/' + imgStr;
      if (id) return `https://cdn.discordapp.com/app-assets/${id}/${imgStr}.png`;
      return imgStr; 
    }

    if (rich.assets?.large_image) {
      actLarge.src = parseImageStr(rich.assets.large_image, appId);
      actLarge.style.display = 'block';
    } else if (appId) {
      actLarge.src = `https://cdn.discordapp.com/app-icons/${appId}/icon.png`;
      actLarge.style.display = 'block';
    } else {
      actLarge.style.display = 'none';
    }

    if (rich.assets?.small_image) {
      actSmall.src = parseImageStr(rich.assets.small_image, appId);
      actSmall.style.display = 'block';
    } else {
      actSmall.style.display = 'none';
    }

    if(rich.timestamps?.start){
      const start = rich.timestamps.start;
      function updateElapsed(){
        const secs = Math.floor((Date.now()-start)/1000);
        const m = Math.floor(secs/60), s = secs%60;
        actElapsed.textContent = `${m}:${String(s).padStart(2,'0')} elapsed`;
        actElapsed.style.display='block';
      }
      updateElapsed();
      window._actElapsedTimer = setInterval(updateElapsed, 1000);
    } else {
      actElapsed.style.display='none';
    }

    card.classList.add('visible');
  } else {
    card.classList.remove('visible');
  }

  setBadges(u.public_flags||0);
}

const BADGE_MAP=[
  [1<<0,'👾'],
  [1<<3,'🎉'],
  [1<<6,'🐛'],
  [1<<9,'💎'],
  [1<<14,'🏆'],
  [1<<17,'🎨'],
];
function setBadges(flags){
  const el=document.getElementById('p-badges');
  el.innerHTML='';
  BADGE_MAP.forEach(([bit,icon])=>{
    if(flags&bit){const s=document.createElement('span');s.className='badge';s.textContent=icon;el.appendChild(s);}
  });
}

function initPlayer(tracks){
  const audio   = document.getElementById('audio');
  const btnPlay = document.getElementById('btn-play');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const btnShuf = document.getElementById('btn-shuf');

  const progTr  = document.getElementById('prog-track');
  const fill    = document.getElementById('prog-fill');
  const volEl   = document.getElementById('vol');
  const volIco  = document.getElementById('vol-icon');
  const artWrap = document.getElementById('art-wrap');
  const artImg  = document.getElementById('art-img');

  if(!tracks.length) return;

  let idx=0, playing=false, shuffled=false, actx=null;
  const shuffleQueue=[];
  function buildQueue(){ shuffleQueue.length=0; const a=[...Array(tracks.length).keys()].filter(i=>i!==idx).sort(()=>Math.random()-.5); shuffleQueue.push(...a,idx); }
  function nextTrack(){ if(shuffled){ shuffleQueue.shift(); if(!shuffleQueue.length) buildQueue(); return shuffleQueue[0]; } return (idx+1)%tracks.length; }
  function prevTrack(){ if(shuffled){ return shuffleQueue[shuffleQueue.length-1]??idx; } return (idx-1+tracks.length)%tracks.length; }

  audio.preload = 'auto';

  function initAudioContext(){
    if(actx) return;
    actx = new (window.AudioContext||window.webkitAudioContext)();
    _analyser = actx.createAnalyser();
    _analyser.fftSize = 2048;
    _analyser.smoothingTimeConstant = 0.8;
    _dataArr = new Uint8Array(_analyser.frequencyBinCount);
    const mediaSrc = actx.createMediaElementSource(audio);
    mediaSrc.connect(_analyser); _analyser.connect(actx.destination);
  }

  function updateArt(t){
    if(t.art){
      artImg.src = t.art;
      artWrap.style.display = 'block';
      artImg.style.animation = 'none';
      requestAnimationFrame(()=>{ artImg.style.animation = ''; });
    } else {
      artWrap.style.display = 'none';
    }
  }

  function load(i, andPlay){
    idx = i;
    const t = tracks[i];
    audio.src = t.src;
    document.getElementById('s-title').textContent  = t.title;
    document.getElementById('s-artist').textContent = t.artist||'';
    fill.style.width = '0%';
    document.getElementById('s-time').textContent = '0:00 / 0:00';
    updateArt(t);
    if(t.startAt > 0){
      audio.addEventListener('loadedmetadata', ()=>{
        audio.currentTime = t.startAt;
      }, {once:true});
    }
    if(andPlay){
      initAudioContext();
      actx.resume().then(()=>{
        audio.play().then(()=>setPlay(true)).catch(()=>{ setPlay(false); });
      });
    }
  }

  function setPlay(v){
    playing=v; _wavePlaying=v;
    document.getElementById('play-icon').innerHTML = v
      ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
      : '<polygon points="5 3 19 12 5 21 5 3"/>';
    if(v && actx && actx.state==='suspended') actx.resume();
  }

  btnShuf.addEventListener('click',()=>{ shuffled=!shuffled; btnShuf.classList.toggle('active',shuffled); if(shuffled) buildQueue(); });
  btnPlay.addEventListener('click',()=>{
    if(!audio.src||audio.src===location.href) return;
    if(playing){
      audio.pause();
      setPlay(false);
    } else {
      initAudioContext();
      actx.resume().then(()=>{
        audio.play()
          .then(()=>setPlay(true))
          .catch(err=>{
            console.error('Playback failed:',err);
            setPlay(false);
            document.getElementById('s-artist').textContent='⚠ Playback failed — check file path/format';
          });
      });
    }
  });

  btnPrev.addEventListener('click',()=>{ load(prevTrack(), playing); });
  btnNext.addEventListener('click',()=>{ load(nextTrack(), playing); });

  audio.addEventListener('timeupdate',()=>{
    if(!audio.duration) return;
    fill.style.width = audio.currentTime/audio.duration*100+'%';
    document.getElementById('s-time').textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
  });
  audio.addEventListener('ended',()=>{ load(nextTrack(), true); });
  audio.addEventListener('error',()=>{
    const codes=['','ABORTED','NETWORK_ERROR','DECODE_ERROR','SRC_NOT_SUPPORTED'];
    const msg = codes[audio.error?.code]||'UNKNOWN';
    document.getElementById('s-artist').textContent = `⚠ ${msg} — check file path & format`;
    setPlay(false);
  });

  function scrubProgress(e){
    if(!audio.duration) return;
    const rect = progTr.getBoundingClientRect();
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = (x - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    audio.currentTime = pct * audio.duration;
  }
  
  progTr.addEventListener('click', scrubProgress);
  
  progTr.addEventListener('touchmove', (e) => {
    e.preventDefault();
    scrubProgress(e);
  }, { passive: false });

  volEl.addEventListener('input',()=>{
    audio.volume = volEl.value;
    const v = +volEl.value;
    
    volEl.style.setProperty('--vol-pct', (v * 100) + '%');

    const svg = document.getElementById('vol-svg');
    if(v < .01){
      svg.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
    } else if(v < .5){
      svg.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
    } else {
      svg.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
    }
  });

  const toast = document.getElementById('kbd-toast');
  let toastTimer = null;
  function showToast(){
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 2200);
  }

  document.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    let handled = true;
    switch(e.code){
      case 'Space':      btnPlay.click(); break;
      case 'ArrowRight': load(nextTrack(), playing); break;
      case 'ArrowLeft':  load(prevTrack(), playing); break;
      case 'ArrowUp':
        volEl.value = Math.min(1,(+volEl.value+0.05)).toFixed(2);
        volEl.dispatchEvent(new Event('input')); break;
      case 'ArrowDown':
        volEl.value = Math.max(0,(+volEl.value-0.05)).toFixed(2);
        volEl.dispatchEvent(new Event('input')); break;
      default: handled = false;
    }
    if(handled){ e.preventDefault(); showToast(); }
  });

  audio.volume = volEl.value;
  volEl.dispatchEvent(new Event('input'));

  const apNudge  = document.getElementById('ap-nudge');
  const splash   = document.getElementById('audio-splash');

  load(0, false);

  function dismissSplashAndPlay(){
    splash.classList.add('fade-out');
    splash.addEventListener('transitionend', ()=>{ splash.remove(); }, {once:true});
    
    let playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => setPlay(true)).catch(err => {
        console.log(err);
        apNudge.classList.add('show');
      });
    }

    initAudioContext();
    if (actx && actx.state === 'suspended') {
      actx.resume();
    }
  }

  splash.addEventListener('click',   dismissSplashAndPlay, {once:true});
  splash.addEventListener('keydown', dismissSplashAndPlay, {once:true});
}

function setName(n){ document.getElementById('p-name').textContent=n; }

function setAvatar(url){
  let el=document.getElementById('av-el');
  if(el.tagName!=='IMG'){
    const img=document.createElement('img');
    img.className='av'; img.id='av-el';
    el.replaceWith(img); el=img;
  }
  el.src=url;
}

function fmt(s){
  if(!isFinite(s)||s<0) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}
